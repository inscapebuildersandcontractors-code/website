  </style>

  <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>

  <title>Construction Careers in Chennai | Inscape Builders</title>
</head>

<body>
  <div id="wrapper">
    <div id="includedContent"></div>

    <nav id="nav_container1" class="menu1">
        <button type="button" class="menu-toggle" aria-controls="nav1" aria-expanded="false"><span aria-hidden="true">☰</span> Menu</button>
      <ul id="nav1" class="navmenu">
          <li><a href="index.html" id="home" class="menu">Home</a></li>

          <li><a href="Careers.html" id="careers" class="selected">Careers</a></li>
      </ul>
    </nav>

    <div class="careers-container">
      <div class="careers-header">
        <h2>Join Our Team</h2>
        <h5>We are hiring around Chennai for Site Engineers, Plumbers, Electricians and civil work dealers. If you are interested, please mention your location.</h5>
      </div>

      <div class="careers-content">
        <div class="careers-form-section">
          <!-- <h3>Apply Now</h3> -->
          <form id="careersForm" action="https://formspree.io/f/xkgvweaz" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_subject" value="New careers application - Inscape Builders">
            <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden" aria-hidden="true">
            <div class="form-group">
              <label for="fname">First Name *</label>
              <input type="text" id="fname" name="fname" required>
            </div>
            
            <div class="form-group">
              <label for="lname">Last Name *</label>
              <input type="text" id="lname" name="lname" required>
            </div>
            
            <div class="form-group">
              <label for="mobileno">Mobile No *</label>
              <input type="tel" id="mobileno" name="mobileno" required minlength="10" maxlength="10" pattern="\d{10}" inputmode="numeric" placeholder="10-digit mobile number">
            </div>
            
            <div class="form-group">
              <label for="email">Email ID *</label> 
              <input type="email" name="email" id="email" maxlength="30" required>
            </div>
            
            <div class="form-group">
              <label for="location">Location *</label>
              <input type="text" id="location" name="location" required>
            </div>

            <div class="form-group">
              <label for="optin">Interested in *</label>
              <select name="optin" id="optin" required>
                <option value="">Select an option</option>
                <option value="site_engineer">Site Engineer</option>
                <option value="plumber">Plumber</option>
                <option value="electrician">Electrician</option>
                <option value="civil_work_dealer">Civil Work Dealer</option>
                <option value="other">Other</option>
              </select>
            </div>
            
            <!-- <div class="form-group">
              <label for="resume">Upload your resume (PDF/DOC/DOCX)</label>
              <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
            </div> -->
            
            <div class="form-group">
              <label for="experience">Years of Experience</label>
              <input type="number" id="experience" name="experience" min="0" max="50">
            </div>
            
            <div class="form-group">
              <label for="message">Additional Message</label>
              <textarea id="message" name="message" placeholder="Tell us about your experience and why you want to join us..."></textarea>
            </div>
            
            <div class="form-buttons">
              <input type="submit" value="Send" id="submitBtn">
              <input type="reset" value="Clear">
            </div>
          </form>

          <div id="formStatus" class="form-status" style="display: none;"></div>
        </div>
      </div>

      <div class="social-section">
        <h3>Connect With Us</h3>
        <div class="social-icons">
          <a href="tel:+919677615163" title="Call us">
            <img src="images/call.jpg" alt="Call" />
          </a>
          <a href="https://api.whatsapp.com/send?phone=919677615163&amp;text=Hello%20Inscape%20Builders%2C%20I%20would%20like%20to%20ask%20about%20careers." title="WhatsApp">
            <img src="images/WhatsApp.png" alt="WhatsApp" />
          </a>
          <a href="https://www.instagram.com/inscape_builders" title="Instagram">
            <img src="images/insta.png" alt="Instagram" />
          </a>
        </div>
        
        <!-- <div class="contact-info">
          <p><strong>📞 Call us directly: +91 96776 15163</strong></p>
          <p><strong>💬 WhatsApp for quick responses</strong></p>
          <p><strong>📸 Follow us on Instagram</strong></p>
        </div> -->
      </div>
    </div>

  </div>

</body>

</html>
